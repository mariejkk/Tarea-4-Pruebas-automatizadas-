<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Gestor de Canchas</title>
    <link rel="stylesheet" href="css/site.css" />
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">🏟GestionCanchas</div>

        <div id="errorLogin" class="error-summary"></div>

        <form id="formLogin">
            <div class="form-group">
                <label for="NombreUsuario">Usuario</label>
                <input type="text" id="NombreUsuario" name="NombreUsuario" class="form-control" placeholder="admin" required autofocus />
            </div>

            <div class="form-group">
                <label for="Password">Contraseña</label>
                <input type="password" id="Password" name="Password" class="form-control" placeholder="••••••••" required />
            </div>

            <button type="submit" id="btnLogin" class="btn btn-primary">Entrar</button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
